<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR Land Boundaries</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 12px 20px;
        border-radius: 6px;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="loading">📡 Loading AR boundary...</div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; gpsMinDistance: 1; debugUIEnabled: false;"
    >
      <a-entity id="boundary-layer"></a-entity>
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      // --- Your GeoJSON boundary data ---
      const geojson = {
        type: "Feature",
        properties: { name: "My Plot" },
        geometry: {
          type: "Polygon",
          coordinates: [
            [
             [-71.06799299683564,45.36275270109053 ],
 [ -71.0679651679721, 45.36293636564523],
 [  -71.0679992363567,45.36464470163011],
 [ -71.06574886446494,45.36464382495869],
  [ -71.06574970802724,45.364095005353214],
 [ -71.06497117171959,45.36409469181381],
 [ -71.06497202328269,45.36354587220936],
 [ -71.06575055158952,45.36354618574768],
 [-71.06575805095848, 45.36275185642023]
            ]
          ]
        }
      };

      // --- Create AR points along the polygon ---
      function createBoundaryAR(feature) {
        const coords = feature.geometry.coordinates[0];
        const scene = document.querySelector("#boundary-layer");

        coords.forEach(([lon, lat], index) => {
          const point = document.createElement("a-entity");
          point.setAttribute(
            "gps-entity-place",
            `latitude: ${lat}; longitude: ${lon};`
          );
          point.setAttribute("geometry", "primitive: sphere; radius: 0.5");
          point.setAttribute("material", "color: yellow; opacity: 0.8;");
          point.setAttribute("id", `point-${index}`);
          scene.appendChild(point);
        });

        // Optionally draw connecting lines between points
        for (let i = 0; i < coords.length - 1; i++) {
          const [lon1, lat1] = coords[i];
          const [lon2, lat2] = coords[i + 1];
          const line = document.createElement("a-entity");
          line.setAttribute(
            "gps-entity-place",
            `latitude: ${lat1}; longitude: ${lon1};`
          );
          line.setAttribute("line", {
            start: "0 0 0",
            end: "0 0 -5",
            color: "red",
          });
          scene.appendChild(line);
        }

        document.getElementById("loading").style.display = "none";
      }

      // --- Initialize ---
      window.onload = () => {
        createBoundaryAR(geojson);
      };
    </script>
  </body>
</html>
