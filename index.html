<!DOCTYPE html>
<html>
<head>
    <title>High Vis AR Boundaries</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/geolib@3.3.4/lib/index.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }
        #debug {
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.8); color: lime; 
            padding: 10px; font-size: 16px; pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div id="debug">Initializing High-Vis Mode...</div>

    <script>
        const boundaryPoints = [
          {lat: 45.36275270109053, lon: -71.06799299683564},
          {lat: 45.36293636564523, lon: -71.0679651679721},
          {lat: 45.36464470163011, lon: -71.0679992363567},
          {lat: 45.36464382495869, lon: -71.06574886446494},
          {lat: 45.364095005353214, lon: -71.06574970802724},
          {lat: 45.36409469181381, lon: -71.06497117171959},
          {lat: 45.36354587220936, lon: -71.06497202328269},
          {lat: 45.36354618574768, lon: -71.06575055158952},
          {lat: 45.36275185642023, lon: -71.06575805095848},
          {lat: 45.36275270109053, lon: -71.06799299683564}
        ];

        // --- MATH HELPERS ---
        function getLocalPosition(anchor, point) {
            const dist = geolib.getDistance(anchor, point);
            const bearing = geolib.getRhumbLineBearing(anchor, point);
            const rad = bearing * (Math.PI / 180);
            return { x: dist * Math.sin(rad), z: -dist * Math.cos(rad) };
        }

        AFRAME.registerComponent('boundary-walls', {
            init: function() {
                const scene = this.el.sceneEl;
                const anchor = boundaryPoints[0];

                // 1. Create the Master Anchor
                const root = document.createElement('a-entity');
                root.setAttribute('gps-new-entity-place', {
                    latitude: anchor.lat,
                    longitude: anchor.lon
                });

                // 2. Add a Giant RED TOWER at the start point
                // This helps you find where the app "thinks" the start is.
                const marker = document.createElement('a-cylinder');
                marker.setAttribute('color', 'red');
                marker.setAttribute('height', '50'); // 50 meters tall
                marker.setAttribute('radius', '1');    // 1 meter thick
                marker.setAttribute('position', '0 25 0'); 
                root.appendChild(marker);

                // 3. Create the Walls
                for (let i = 0; i < boundaryPoints.length - 1; i++) {
                    const p1 = boundaryPoints[i];
                    const p2 = boundaryPoints[i+1];
                    
                    const pos1 = getLocalPosition(anchor, p1);
                    const pos2 = getLocalPosition(anchor, p2);

                    const dx = pos2.x - pos1.x;
                    const dz = pos2.z - pos1.z;
                    const len = Math.sqrt(dx*dx + dz*dz);
                    const angleDeg = Math.atan2(dx, dz) * (180 / Math.PI);
                    const midX = (pos1.x + pos2.x) / 2;
                    const midZ = (pos1.z + pos2.z) / 2;

                    // We use a Box instead of a cylinder to look like a wall
                    const wall = document.createElement('a-box');
                    wall.setAttribute('depth', len);  // Length of the wall
                    wall.setAttribute('height', '20'); // 20 METERS TALL (approx 60 feet)
                    wall.setAttribute('width', '0.5'); // 50cm thick
                    
                    wall.setAttribute('color', 'yellow');
                    wall.setAttribute('opacity', '0.5'); // Semi-transparent
                    
                    // Position y=10 ensures it goes from 0 (ground) to 20m high
                    wall.setAttribute('position', `${midX} 10 ${midZ}`);
                    wall.setAttribute('rotation', `0 ${angleDeg} 0`);

                    root.appendChild(wall);
                }

                scene.appendChild(root);
                
                // Update Debug Text
                const debug = document.getElementById('debug');
                debug.innerHTML = "Loaded! Look for the RED TOWER.";
                
                // Optional: Listen for camera update to show distance
                window.addEventListener('gps-camera-update-position', (e) => {
                     debug.innerHTML = `GPS Active. Accuracy: ${Math.round(e.detail.position.accuracy)}m`;
                });
            }
        });
    </script>

    <a-scene
        boundary-walls
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;">
        
        <a-camera gps-new-camera='gpsMinDistance: 5' far="2000"></a-camera>
        
    </a-scene>
</body>
</html>
