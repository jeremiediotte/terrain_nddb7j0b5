<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: black; color: #0f0; font-family: monospace; font-size: 18px; padding: 20px; }
        .error { color: red; border: 1px solid red; padding: 10px; }
        button { font-size: 20px; padding: 15px; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>BROWSER GPS DIAGNOSTIC</h2>
    <div id="log">Initializing...</div>
    <div id="details"></div>
    <button onclick="forceRequest()">RE-REQUEST PERMISSION</button>

    <script>
        const log = document.getElementById('log');
        const det = document.getElementById('details');

        function print(msg, isError) {
            log.innerHTML = msg;
            if(isError) log.className = "error";
            else log.className = "";
        }

        function showDetails(pos) {
            det.innerHTML = 
                "Lat: " + pos.coords.latitude.toFixed(6) + "<br>" +
                "Lon: " + pos.coords.longitude.toFixed(6) + "<br>" +
                "Accuracy: " + Math.round(pos.coords.accuracy) + " meters<br>" +
                "Timestamp: " + new Date(pos.timestamp).toLocaleTimeString();
        }

        function startWatch() {
            if (!navigator.geolocation) {
                print("ERROR: Geolocation API not found. Are you using a modern browser?", true);
                return;
            }

            print("Requesting high-accuracy GPS...");

            navigator.geolocation.watchPosition(
                (pos) => {
                    print("SUCCESS! GPS Signal Received.");
                    showDetails(pos);
                },
                (err) => {
                    let errName = "";
                    switch(err.code) {
                        case 1: errName = "PERMISSION_DENIED"; break;
                        case 2: errName = "POSITION_UNAVAILABLE"; break;
                        case 3: errName = "TIMEOUT"; break;
                    }
                    print("ERROR: " + errName + "<br>" + err.message, true);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 0
                }
            );
        }

        function forceRequest() {
            log.innerHTML = "Re-requesting...";
            startWatch();
        }

        // Start immediately
        startWatch();
    </script>
</body>
</html>
