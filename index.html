<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AR Land Boundary Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.rawgit.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geolib@3.3.3/lib/index.min.js"></script>
<style>
  #calibrate-btn {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 999;
    background: #fff;
    border: 1px solid #333;
    padding: 5px 10px;
    cursor: pointer;
  }
</style>
</head>
<body style="margin: 0; overflow: hidden;">
<button id="calibrate-btn">Calibrate Here</button>
<a-scene embedded arjs="sourceType: webcam; gpsMinAccuracy: 20;" vr-mode-ui="enabled: false">
  <a-entity id="land-boundary"></a-entity>
  <a-camera gps-camera rotation-reader></a-camera>
</a-scene>

<script>
const corners = [
  {lat: 45.36275270109053, lon: -71.06799299683564},
  {lat: 45.36293636564523, lon: -71.0679651679721},
  {lat: 45.36464470163011, lon: -71.0679992363567},
  {lat: 45.36464382495869, lon: -71.06574886446494},
  {lat: 45.364095005353214, lon: -71.06574970802724},
  {lat: 45.36409469181381, lon: -71.06497117171959},
  {lat: 45.36354587220936, lon: -71.06497202328269},
  {lat: 45.36354618574768, lon: -71.06575055158952},
  {lat: 45.36275185642023, lon: -71.06575805095848}
];

// Colors for lines (cyclic for orientation visualization)
const colors = ['red','green','blue','yellow','orange','purple','cyan','magenta','lime'];

const landEl = document.getElementById('land-boundary');

let calibration = {lat: 0, lon: 0, calibrated: false};
document.getElementById('calibrate-btn').addEventListener('click', () => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      calibration.lat = pos.coords.latitude;
      calibration.lon = pos.coords.longitude;
      calibration.calibrated = true;
      alert('Calibration point set!');
    });
  }
});

// Helper: Convert lat/lon to meters relative to first corner
function latLonToMeters(lat, lon) {
  const first = corners[0];
  const dx = geolib.getDistance(
    {latitude: first.lat, longitude: first.lon},
    {latitude: first.lat, longitude: lon}
  );
  const dy = geolib.getDistance(
    {latitude: first.lat, longitude: first.lon},
    {latitude: lat, longitude: first.lon}
  );
  // Adjust signs
  return {
    x: lon > first.lon ? dx : -dx,
    z: lat > first.lat ? -dy : dy, // A-Frame uses z-forward negative
    y: 0
  };
}

// Helper: Calculate distance between two corners in meters
function distance(c1, c2) {
  return geolib.getDistance(
    {latitude: c1.lat, longitude: c1.lon},
    {latitude: c2.lat, longitude: c2.lon}
  );
}

// Helper: Calculate angle at a corner (degrees)
function angleAtCorner(prev, current, next) {
  const v1 = [prev.lat - current.lat, prev.lon - current.lon];
  const v2 = [next.lat - current.lat, next.lon - current.lon];
  const dot = v1[0]*v2[0] + v1[1]*v2[1];
  const mag1 = Math.sqrt(v1[0]**2 + v1[1]**2);
  const mag2 = Math.sqrt(v2[0]**2 + v2[1]**2);
  return Math.acos(dot/(mag1*mag2)) * (180/Math.PI);
}

// Add markers
corners.forEach((corner,i) => {
  const pos = latLonToMeters(corner.lat, corner.lon);
  const sphere = document.createElement('a-sphere');
  sphere.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
  sphere.setAttribute('radius', 0.5);
  sphere.setAttribute('color', 'yellow');
  sphere.setAttribute('opacity', 0.8);
  landEl.appendChild(sphere);

  // Angle label
  const prev = corners[(i-1+corners.length)%corners.length];
  const next = corners[(i+1)%corners.length];
  const ang = angleAtCorner(prev, corner, next).toFixed(1);
  const text = document.createElement('a-text');
  text.setAttribute('value', ang + '°');
  text.setAttribute('position', `${pos.x} 1.2 ${pos.z}`);
  text.setAttribute('align', 'center');
  text.setAttribute('color', 'white');
  text.setAttribute('side', 'double');
  landEl.appendChild(text);
});

// Add lines with distance labels
for (let i=0;i<corners.length;i++) {
  const c1 = latLonToMeters(corners[i].lat, corners[i].lon);
  const c2 = latLonToMeters(corners[(i+1)%corners.length].lat, corners[(i+1)%corners.length].lon);
  // Line
  const line = document.createElement('a-entity');
  line.setAttribute('line', `start:${c1.x} ${c1.y} ${c1.z}; end:${c2.x} ${c2.y} ${c2.z}; color:${colors[i%colors.length]}`);
  landEl.appendChild(line);

  // Distance label
  const midX = (c1.x + c2.x)/2;
  const midZ = (c1.z + c2.z)/2;
  const dist = distance(corners[i], corners[(i+1)%corners.length]);
  const text = document.createElement('a-text');
  text.setAttribute('value', dist + 'm');
  text.setAttribute('position', `${midX} 1 ${midZ}`);
  text.setAttribute('align', 'center');
  text.setAttribute('color', 'white');
  text.setAttribute('side', 'double');
  landEl.appendChild(text);
}
</script>
</body>
</html>
