<!DOCTYPE html>
<html>
<head>
    <title>AR Boundary v6</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }

        #cam {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: 0;
        }
        #overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        /* ── LOADING ── */
        #screen-load {
            position: fixed; inset: 0; background: #000; color: #00ffcc;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; z-index: 9999; padding: 24px;
        }
        #screen-load h2 {
            font-size: 18px; letter-spacing: 4px; text-transform: uppercase;
            border-bottom: 1px solid #00ffcc33;
            padding-bottom: 12px; margin-bottom: 18px;
        }
        .sl { list-style: none; text-align: left; min-width: 270px; margin-bottom: 14px; }
        .sl li {
            padding: 7px 0; font-size: 13px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid #ffffff0f;
        }
        .ic { width: 18px; text-align: center; }
        .ok   { color: #00ffcc; }
        .wait { color: #666; animation: bl 1s infinite; }
        .err  { color: #ff8800; }
        @keyframes bl { 0%,100%{opacity:1}50%{opacity:.2} }

        #acc-wrap { width: 270px; height: 5px; background: #1a1a1a; border-radius: 3px; margin-bottom: 18px; }
        #acc-bar  { height: 100%; width: 0; border-radius: 3px; transition: width .5s, background .5s; }

        #btn-start {
            padding: 13px 32px; font-size: 14px; letter-spacing: 3px;
            text-transform: uppercase; background: transparent; color: #00ffcc;
            border: 2px solid #00ffcc; border-radius: 4px; cursor: pointer;
            font-family: 'Courier New', monospace; transition: all .2s;
        }
        #btn-start:not(:disabled):active { background: #00ffcc; color: #000; }
        #btn-start:disabled { opacity: .25; cursor: default; }

        /* ── HUD ── */
        #hud-top {
            position: fixed; top: 0; left: 0; right: 0;
            display: none; justify-content: space-between; align-items: center;
            padding: 8px 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,.85) 0%, transparent 100%);
            z-index: 10;
        }
        .hbtn {
            background: rgba(0,0,0,.8); border: 1px solid #444; color: #ccc;
            padding: 6px 12px; font-size: 11px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            -webkit-tap-highlight-color: transparent;
        }
        .hbtn.save  { border-color: #00ffcc; color: #00ffcc; }
        .hbtn.rst   { border-color: #ff5555; color: #ff5555; }
        #hud-info {
            background: rgba(0,0,0,.75); color: #00ffcc;
            padding: 5px 10px; border-radius: 4px;
            font-size: 10px; letter-spacing: .5px;
            text-align: center; line-height: 1.7;
        }

        /* ── RADAR (mini-carte coin bas-gauche) ── */
        #radar-wrap {
            position: fixed; bottom: 130px; left: 10px;
            width: 130px; height: 130px;
            background: rgba(0,0,0,.75);
            border: 1px solid #00ffcc44;
            border-radius: 8px; z-index: 10;
            display: none; overflow: hidden;
        }
        #radar { width: 100%; height: 100%; }

        /* ── CONTROLS ── */
        #controls {
            position: fixed; bottom: 14px; left: 0; right: 0;
            display: none; flex-direction: column; align-items: center;
            z-index: 10; gap: 6px; pointer-events: auto;
        }
        .crow { display: flex; gap: 8px; }
        .cb {
            width: 52px; height: 52px; border-radius: 50%;
            background: rgba(0,0,0,.8); border: 2px solid #00ffcc; color: #00ffcc;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent;
            transition: background .1s, color .1s;
        }
        .cb:active { background: #00ffcc; color: #000; }
        .cb.sm  { width: 44px; height: 44px; font-size: 15px; }
        .cb.org { border-color: #ff8800; color: #ff8800; }
        .cb.org:active { background: #ff8800; color: #000; }
        #step-row { display: flex; gap: 6px; }
        .sb {
            padding: 4px 11px; border-radius: 10px;
            background: rgba(0,0,0,.8); border: 1px solid #444; color: #666;
            font-size: 11px; cursor: pointer;
            font-family: 'Courier New', monospace;
            -webkit-tap-highlight-color: transparent; transition: all .15s;
        }
        .sb.on { border-color: #00ffcc; color: #00ffcc; }
    </style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<div id="screen-load">
    <h2>⬡ AR Boundary v6</h2>
    <ul class="sl">
        <li><span class="ic wait" id="i-cam">◌</span><span id="l-cam">Caméra — en attente…</span></li>
        <li><span class="ic wait" id="i-gps">◌</span><span id="l-gps">GPS — en attente…</span></li>
        <li><span class="ic wait" id="i-cmp">◌</span><span id="l-cmp">Boussole + inclinaison…</span></li>
    </ul>
    <div id="acc-wrap"><div id="acc-bar"></div></div>
    <button id="btn-start" onclick="startAR()" disabled>CHARGER LES BORNES</button>
</div>

<div id="hud-top">
    <button class="hbtn rst"  onclick="clearCalib()">RESET</button>
    <div id="hud-info">— —</div>
    <button class="hbtn save" onclick="saveCalib()">SAUVEGARDER</button>
</div>

<!-- Mini radar top-down -->
<div id="radar-wrap">
    <canvas id="radar"></canvas>
</div>

<div id="controls">
    <div id="step-row">
        <button class="sb on" onclick="setStep(1, this)">1°/1m</button>
        <button class="sb"    onclick="setStep(5, this)">5°/5m</button>
        <button class="sb"    onclick="setStep(15,this)">15°</button>
    </div>
    <div class="crow">
        <button class="cb" onclick="adj('rot',-step)">↺</button>
        <button class="cb" onclick="adj('n', step)">▲</button>
        <button class="cb" onclick="adj('rot', step)">↻</button>
    </div>
    <div class="crow">
        <button class="cb" onclick="adj('e',-step)">◀</button>
        <button class="cb sm org" onclick="resetCalib()">●</button>
        <button class="cb" onclick="adj('e', step)">▶</button>
    </div>
    <div class="crow">
        <button class="cb" onclick="adj('n',-step)">▼</button>
    </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════
//  TERRAIN
// ═══════════════════════════════════════════════
const BOUNDARY = [
    {lat: 45.36275270109053, lon: -71.06799299683564},
    {lat: 45.36293636564523, lon: -71.06796516797210},
    {lat: 45.36464470163011, lon: -71.06799923635670},
    {lat: 45.36464382495869, lon: -71.06574886446494},
    {lat: 45.36409500535321, lon: -71.06574970802724},
    {lat: 45.36409469181381, lon: -71.06497117171959},
    {lat: 45.36354587220936, lon: -71.06497202328269},
    {lat: 45.36354618574768, lon: -71.06575055158952},
    {lat: 45.36275185642023, lon: -71.06575805095848},
    {lat: 45.36275270109053, lon: -71.06799299683564}
];

// ═══════════════════════════════════════════════
//  CONSTANTES
// ═══════════════════════════════════════════════
const DEG2RAD    = Math.PI / 180;
const EARTH_R    = 6371000;
const CAM_HEIGHT = 1.5;   // hauteur du téléphone du sol (mètres)
const H_FOV      = 68;    // FOV horizontal caméra (degrés) — typique Android
const V_FOV      = 52;    // FOV vertical (degrés)

// ═══════════════════════════════════════════════
//  ÉTAT
// ═══════════════════════════════════════════════
let myLat = null, myLon = null, gpsAcc = 999;
let heading = 0;   // cap lissé (0=Nord, 90=Est)
let pitch   = 45;  // inclinaison téléphone en degrés
                   // 0=horizontal, 90=pointé au sol
                   // beta de deviceorientation

let step  = 1;
let calib = { rot: 0, n: 0, e: 0 };
let camReady = false, gpsReady = false, cmpReady = false;

// ── Lissage heading (moyenne circulaire) ──────
const SMOOTH_N = 20;
const sinH = new Float64Array(SMOOTH_N);
const cosH = new Float64Array(SMOOTH_N);
let hIdx = 0, hFull = false;
let lastH = null, lastHt = 0;

function pushHeading(h) {
    const now = Date.now();
    if (lastH !== null) {
        let diff = Math.abs(h - lastH);
        if (diff > 180) diff = 360 - diff;
        // Rejeter sauts > 40° en moins de 80ms
        if ((now - lastHt) < 80 && diff > 40) return;
    }
    lastH = h; lastHt = now;
    const r = h * DEG2RAD;
    sinH[hIdx] = Math.sin(r);
    cosH[hIdx] = Math.cos(r);
    hIdx = (hIdx + 1) % SMOOTH_N;
    if (hIdx === 0) hFull = true;
    const n = hFull ? SMOOTH_N : hIdx;
    let sx = 0, sy = 0;
    for (let i = 0; i < n; i++) { sx += sinH[i]; sy += cosH[i]; }
    heading = ((Math.atan2(sx/n, sy/n) / DEG2RAD) + 360) % 360;
}

// ── Lissage pitch (simple EMA) ────────────────
let pitchSmooth = 45;
function pushPitch(p) {
    // beta : 0=horizontal, positif = penché vers toi (bas)
    // On clamp entre 10° et 85°
    const clamped = Math.max(10, Math.min(85, p));
    pitchSmooth = pitchSmooth * 0.85 + clamped * 0.15;
    pitch = pitchSmooth;
}

// ═══════════════════════════════════════════════
//  MATHS GPS
// ═══════════════════════════════════════════════
function gpsVector(lat1, lon1, lat2, lon2) {
    const φ1 = lat1*DEG2RAD, φ2 = lat2*DEG2RAD;
    const Δφ = (lat2-lat1)*DEG2RAD;
    const Δλ = (lon2-lon1)*DEG2RAD;
    const a  = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
    const dist    = 2*EARTH_R*Math.asin(Math.sqrt(a));
    const y       = Math.sin(Δλ)*Math.cos(φ2);
    const x       = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
    const bearing = ((Math.atan2(y,x)/DEG2RAD)+360)%360;
    return { dist, bearing };
}

// ═══════════════════════════════════════════════
//  PROJECTION PITCH-AWARE
//
//  Le téléphone est tenu incliné vers le bas (pitch > 0).
//  La caméra regarde dans la direction :
//    - horizontale : heading (cap)
//    - verticale   : -pitch  (vers le bas)
//
//  Pour un point P au sol à distance D et angle horizontal φ :
//    hAngle = bearing(moi→P) - heading        → position X dans l'image
//    vAngle = atan(CAM_HEIGHT / D) - pitch     → position Y dans l'image
//             (angle d'élévation du point par rapport au centre caméra)
//
//  Projection linéaire (valable pour FOV < 90°) :
//    px = W/2 + hAngle / (H_FOV/2) * W/2
//    py = H/2 - vAngle / (V_FOV/2) * H/2
//         (négatif = vers le haut de l'écran)
// ═══════════════════════════════════════════════
function project(lat, lon, W, H) {
    if (myLat === null) return null;

    // Calibration translation
    const mPerLat = 111320;
    const mPerLon = 111320 * Math.cos(myLat * DEG2RAD);
    const adjLat  = lat + calib.n / mPerLat;
    const adjLon  = lon + calib.e / mPerLon;

    const { dist, bearing } = gpsVector(myLat, myLon, adjLat, adjLon);
    if (dist < 0.5) return null; // trop proche, on skip

    // ── Horizontal ──
    let hAngle = bearing - heading - calib.rot;
    hAngle = ((hAngle + 540) % 360) - 180; // [-180, 180]
    if (Math.abs(hAngle) > H_FOV * 0.75) return null; // hors champ

    // ── Vertical ──
    // Angle d'élévation du point au sol vu depuis la caméra
    // (positif = au-dessus de l'horizontal, négatif = en dessous)
    const elevRad = Math.atan2(CAM_HEIGHT, dist); // toujours positif (sol sous nous)
    const elevDeg = elevRad / DEG2RAD;            // ex: dist=20m → ~4.3°, dist=5m → ~17°

    // Le centre de l'image regarde à -pitch (vers le bas)
    // donc un point à elevDeg sous l'horizontal apparaît à :
    // vAngle = -elevDeg - (-pitch) = pitch - elevDeg
    // si vAngle > 0 → point est au-dessus du centre → haut de l'écran
    // si vAngle < 0 → point est sous le centre      → bas de l'écran
    const vAngle = pitch - elevDeg;

    // Pixel Y : centre = H/2, +V_FOV/2 = bas, -V_FOV/2 = haut
    // On inverse car Y croît vers le bas
    const px = W/2 + (hAngle / (H_FOV/2)) * (W/2);
    const py = H/2 - (vAngle / (V_FOV/2)) * (H/2);

    return { px, py, dist, hAngle, vAngle };
}

// ═══════════════════════════════════════════════
//  DRAW — OVERLAY CAMÉRA
// ═══════════════════════════════════════════════
function draw() {
    const canvas = document.getElementById('overlay');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width  = window.innerWidth;
    const H = canvas.height = window.innerHeight;
    ctx.clearRect(0, 0, W, H);

    if (myLat !== null) {
        const pts = BOUNDARY.map(p => project(p.lat, p.lon, W, H));

        // Segments
        for (let i = 0; i < pts.length - 1; i++) {
            const a = pts[i], b = pts[i+1];
            if (!a && !b) continue;
            const pa = a || edgeClip(b, W, H);
            const pb = b || edgeClip(a, W, H);
            if (!pa || !pb) continue;

            const avgDist = ((a?.dist ?? 40) + (b?.dist ?? 40)) / 2;
            const alpha   = Math.min(0.95, Math.max(0.4, 1 - avgDist/200));
            const lw      = Math.min(8, Math.max(2, 100/avgDist));

            // Halo
            ctx.beginPath();
            ctx.moveTo(pa.px, pa.py);
            ctx.lineTo(pb.px, pb.py);
            ctx.strokeStyle = `rgba(255,200,0,${alpha*0.25})`;
            ctx.lineWidth   = lw * 5;
            ctx.lineCap     = 'round';
            ctx.stroke();

            // Ligne principale
            ctx.beginPath();
            ctx.moveTo(pa.px, pa.py);
            ctx.lineTo(pb.px, pb.py);
            ctx.strokeStyle = `rgba(255,220,0,${alpha})`;
            ctx.lineWidth   = lw;
            ctx.stroke();
        }

        // Marqueurs de coins
        for (let i = 0; i < pts.length - 1; i++) {
            const p = pts[i];
            if (!p) continue;
            const alpha = Math.min(1, Math.max(0.5, 1 - p.dist/200));
            const r     = Math.min(14, Math.max(5, 70/p.dist));

            ctx.beginPath();
            ctx.arc(p.px, p.py, r, 0, Math.PI*2);
            ctx.fillStyle   = i === 0 ? `rgba(255,50,50,${alpha})` : `rgba(255,80,180,${alpha})`;
            ctx.fill();
            ctx.strokeStyle = `rgba(255,255,255,${alpha*0.8})`;
            ctx.lineWidth   = 1.5;
            ctx.stroke();

            // Distance label
            if (p.dist < 150) {
                ctx.font         = `bold ${Math.max(10,Math.min(15,60/p.dist))}px Courier New`;
                ctx.fillStyle    = `rgba(0,255,200,${alpha})`;
                ctx.textAlign    = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(`${Math.round(p.dist)}m`, p.px, p.py + r + 3);
            }
        }

        // Boussole
        drawCompass(ctx, W-40, 65, 26);

        // Indicateur pitch (barre verticale gauche)
        drawPitchBar(ctx, 18, H*0.2, H*0.6);
    }

    // HUD
    const el = document.getElementById('hud-info');
    if (myLat !== null) {
        el.innerHTML =
            `Cap: <b>${Math.round((heading+calib.rot+360)%360)}°</b>` +
            `&nbsp; Pitch: <b>${Math.round(pitch)}°</b>` +
            `&nbsp; GPS: ±${Math.round(gpsAcc)}m<br>` +
            `Calib R:${calib.rot}° N:${calib.n}m E:${calib.e}m`;
    } else {
        el.innerText = 'En attente GPS…';
    }

    // Radar
    drawRadar();

    requestAnimationFrame(draw);
}

// Clip un point hors-écran vers le bord
function edgeClip(ref, W, H) {
    if (!ref) return null;
    return {
        px: Math.max(0, Math.min(W, ref.px)),
        py: Math.max(0, Math.min(H, ref.py)),
        dist: ref.dist
    };
}

// Indicateur d'inclinaison (pitch) — barre verticale gauche
function drawPitchBar(ctx, x, y, h) {
    // Fond
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.beginPath();
    ctx.roundRect(x-10, y, 20, h, 5);
    ctx.fill();

    // Zone active (pitch 10°→85°)
    const pct = (pitch - 10) / 75;
    const barH = h * pct;
    ctx.fillStyle = pitch < 30 ? '#ffaa00' : pitch < 65 ? '#00ffcc' : '#ff4444';
    ctx.beginPath();
    ctx.roundRect(x-8, y + h - barH, 16, barH, 3);
    ctx.fill();

    // Label
    ctx.font         = '9px Courier New';
    ctx.fillStyle    = '#aaa';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`${Math.round(pitch)}°`, x, y - 2);
    ctx.fillText('↓', x, y + h + 12);
}

// Boussole
function drawCompass(ctx, cx, cy, r) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fillStyle   = 'rgba(0,0,0,.6)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,255,200,.25)';
    ctx.lineWidth   = 1; ctx.stroke();
    ctx.rotate(-(heading+calib.rot)*DEG2RAD);
    ctx.beginPath(); ctx.moveTo(0,-r*.72); ctx.lineTo(r*.2,r*.28); ctx.lineTo(-r*.2,r*.28); ctx.closePath();
    ctx.fillStyle = '#ff4444'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,r*.72); ctx.lineTo(r*.2,-r*.28); ctx.lineTo(-r*.2,-r*.28); ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
    ctx.restore();
    ctx.font='bold 8px Courier New'; ctx.fillStyle='#fff';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('N', cx, cy-r-7);
}

// ═══════════════════════════════════════════════
//  RADAR — vue du dessus (top-down)
// ═══════════════════════════════════════════════
function drawRadar() {
    const rc  = document.getElementById('radar');
    const ctx = rc.getContext('2d');
    const W   = rc.width  = 130;
    const H   = rc.height = 130;
    const cx  = W/2, cy = H/2;
    const SCALE = 150; // 1m = ? pixels (terrain ~400m → on affiche ~150m de rayon)

    ctx.clearRect(0, 0, W, H);

    if (myLat === null) return;

    // Fond
    ctx.fillStyle = 'rgba(0,20,15,.9)';
    ctx.fillRect(0, 0, W, H);

    // Grille
    ctx.strokeStyle = 'rgba(0,255,200,.1)';
    ctx.lineWidth   = 1;
    [30,60,90].forEach(r => {
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    });

    const mPerLat = 111320;
    const mPerLon = 111320 * Math.cos(myLat*DEG2RAD);

    // Convertir un point GPS en pixels radar (centré sur moi, Nord=haut)
    function toRadar(lat, lon) {
        const adjLat = lat + calib.n/mPerLat;
        const adjLon = lon + calib.e/mPerLon;
        const dN = (adjLat - myLat) * mPerLat;   // mètres Nord
        const dE = (adjLon - myLon) * mPerLon;   // mètres Est
        return {
            x: cx + dE * (90/SCALE),
            y: cy - dN * (90/SCALE)  // Nord = haut
        };
    }

    // Terrain
    ctx.beginPath();
    const r0 = toRadar(BOUNDARY[0].lat, BOUNDARY[0].lon);
    ctx.moveTo(r0.x, r0.y);
    for (let i = 1; i < BOUNDARY.length; i++) {
        const rp = toRadar(BOUNDARY[i].lat, BOUNDARY[i].lon);
        ctx.lineTo(rp.x, rp.y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,220,0,.8)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    ctx.fillStyle   = 'rgba(255,200,0,.07)';
    ctx.fill();

    // Moi (triangle orienté selon le cap)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate((heading+calib.rot)*DEG2RAD);
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(5, 5); ctx.lineTo(-5, 5);
    ctx.closePath();
    ctx.fillStyle   = '#00ffcc';
    ctx.fill();
    ctx.restore();

    // Label "N"
    ctx.font='8px Courier New'; ctx.fillStyle='rgba(0,255,200,.5)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('N', cx, 7);
}

// ═══════════════════════════════════════════════
//  CAPTEURS
// ═══════════════════════════════════════════════
function initSensors() {
    let gotAbsolute = false;

    // Android Chrome — deviceorientationabsolute = vrai Nord magnétique
    window.addEventListener('deviceorientationabsolute', e => {
        if (e.alpha === null) return;
        gotAbsolute = true;
        pushHeading((360 - e.alpha) % 360);
        // beta : inclinaison avant/arrière
        // Sur Android tenu à la verticale beta≈90, incliné vers sol beta diminue
        // On veut pitch = angle entre téléphone et horizontal
        // beta=90 → horizontal, beta=0 → vertical face
        // Notre convention : 0°=horizontal, 90°=pointé au sol
        if (e.beta !== null) pushPitch(90 - Math.abs(e.beta));
        if (!cmpReady) {
            setSt('cmp','ok','✓ Boussole + pitch (Android)');
            cmpReady = true; checkReady();
        }
    }, true);

    window.addEventListener('deviceorientation', e => {
        if (gotAbsolute) return; // déjà géré par absolute
        if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
            pushHeading(e.webkitCompassHeading);
        } else if (e.alpha !== null) {
            pushHeading((360 - e.alpha) % 360);
        }
        if (e.beta !== null) pushPitch(90 - Math.abs(e.beta));
        if (!cmpReady) {
            setSt('cmp','ok','✓ Boussole + pitch actifs');
            cmpReady = true; checkReady();
        }
    }, true);

    // Timeout : si pas de boussole après 3s, continuer sans
    setTimeout(() => {
        if (!cmpReady) {
            setSt('cmp','err','⚠ Boussole absente — calibration manuelle');
            cmpReady = true; checkReady();
        }
    }, 3000);
}

function initGps() {
    if (!navigator.geolocation) { setSt('gps','err','✗ GPS non disponible'); return; }
    navigator.geolocation.watchPosition(pos => {
        myLat  = pos.coords.latitude;
        myLon  = pos.coords.longitude;
        gpsAcc = pos.coords.accuracy;
        const pct = Math.max(0, Math.min(100, (1-gpsAcc/30)*100));
        const bar = document.getElementById('acc-bar');
        bar.style.width      = pct+'%';
        bar.style.background = gpsAcc<5?'#00ffcc':gpsAcc<15?'#ffaa00':'#ff4444';
        if (!gpsReady && gpsAcc<=20) {
            setSt('gps','ok',`✓ GPS prêt (±${Math.round(gpsAcc)}m)`);
            gpsReady=true; checkReady();
        } else if (!gpsReady) {
            setSt('gps','wait',`GPS… ±${Math.round(gpsAcc)}m`);
        }
    }, () => setSt('gps','err','✗ GPS — activez la localisation'),
    { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}

function initCamera() {
    const vid = document.getElementById('cam');
    navigator.mediaDevices.getUserMedia({
        video: { facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} },
        audio: false
    }).then(stream => {
        vid.srcObject = stream;
        vid.onloadedmetadata = () => {
            vid.play();
            setSt('cam','ok','✓ Caméra prête');
            camReady=true; checkReady();
        };
    }).catch(() => setSt('cam','err','✗ Caméra refusée'));
}

// ═══════════════════════════════════════════════
//  CALIBRATION
// ═══════════════════════════════════════════════
function adj(axis, val) {
    if (axis==='rot') calib.rot += val;
    if (axis==='n')   calib.n   += val;
    if (axis==='e')   calib.e   += val;
}
function resetCalib()  { calib = {rot:0,n:0,e:0}; }
function saveCalib() {
    localStorage.setItem('arBoundaryCalib_v6', JSON.stringify(calib));
    const el = document.getElementById('hud-info');
    el.style.color='#00ff88'; el.innerText='✓ Sauvegardé';
    setTimeout(()=>{ el.style.color='#00ffcc'; }, 1600);
}
function clearCalib() {
    if (!confirm('Réinitialiser?')) return;
    localStorage.removeItem('arBoundaryCalib_v6');
    calib = {rot:0,n:0,e:0};
}
function loadCalib() {
    try { const s=localStorage.getItem('arBoundaryCalib_v6'); if(s) calib=JSON.parse(s); } catch(e){}
}
function setStep(val,btn) {
    step=val;
    document.querySelectorAll('.sb').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════
function setSt(key,state,text) {
    document.getElementById(`i-${key}`).className=`ic ${state}`;
    document.getElementById(`i-${key}`).innerText=state==='ok'?'✓':state==='err'?'✗':'◌';
    document.getElementById(`l-${key}`).innerText=text;
}
function checkReady() {
    if (camReady&&gpsReady&&cmpReady) document.getElementById('btn-start').disabled=false;
}

// ═══════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════
async function startAR() {
    if (typeof DeviceOrientationEvent!=='undefined' &&
        typeof DeviceOrientationEvent.requestPermission==='function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
    }
    loadCalib();
    document.getElementById('screen-load').style.display = 'none';
    document.getElementById('hud-top').style.display     = 'flex';
    document.getElementById('controls').style.display    = 'flex';
    document.getElementById('radar-wrap').style.display  = 'block';
    draw();
}

window.addEventListener('load', () => {
    initCamera();
    initGps();
    initSensors();
});
window.addEventListener('resize', () => {
    document.getElementById('overlay').width  = window.innerWidth;
    document.getElementById('overlay').height = window.innerHeight;
});
</script>
