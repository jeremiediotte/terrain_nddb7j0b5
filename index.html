<!DOCTYPE html>
<html>
<head>
    <title>AR Boundary v3</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-ar-nft@6.0.0/dist/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/geolib@3.3.4/lib/index.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; font-family: 'Courier New', monospace; background: #000; }

        #ar-video-source {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: 0;
        }
        a-scene {
            position: fixed !important;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        canvas.a-canvas { background: transparent !important; }

        /* ── LOADING ── */
        #initial-screen {
            position: fixed; inset: 0; background: #000; color: #00ffcc;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; z-index: 9999; padding: 24px;
        }
        #initial-screen h2 {
            font-size: 20px; letter-spacing: 4px; text-transform: uppercase;
            border-bottom: 1px solid #00ffcc44; padding-bottom: 12px; margin-bottom: 20px;
        }
        #status-list { list-style: none; text-align: left; min-width: 280px; margin-bottom: 16px; }
        #status-list li {
            padding: 8px 0; font-size: 13px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid #ffffff11;
        }
        .s-icon { font-size: 16px; width: 20px; text-align: center; }
        .s-ok   { color: #00ffcc; }
        .s-wait { color: #888; animation: blink 1s infinite; }
        .s-err  { color: #ff4444; }
        @keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }

        #acc-wrap { width: 280px; height: 5px; background: #222; border-radius: 3px; margin-bottom: 20px; }
        #acc-bar  { height: 100%; width: 0; border-radius: 3px; transition: width .4s, background .4s; }

        #start-btn {
            padding: 14px 36px; font-size: 15px; letter-spacing: 3px;
            text-transform: uppercase; background: transparent; color: #00ffcc;
            border: 2px solid #00ffcc; border-radius: 4px; cursor: pointer;
            font-family: 'Courier New', monospace; transition: all .2s;
        }
        #start-btn:not(:disabled):hover { background: #00ffcc; color: #000; }
        #start-btn:disabled { opacity: .3; cursor: default; }

        /* ── HUD ── */
        #top-menu {
            position: fixed; top: 0; left: 0; right: 0; height: 50px;
            display: none; justify-content: space-between; align-items: center;
            padding: 0 12px;
            background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
            z-index: 1000;
        }
        .menu-btn {
            background: rgba(0,0,0,.8); border: 1px solid #555; color: #fff;
            padding: 7px 14px; font-size: 12px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }
        .save-btn  { border-color: #00ffcc; color: #00ffcc; }
        .clear-btn { border-color: #ff4444; color: #ff4444; }
        #coord-display {
            background: rgba(0,0,0,.7); color: #00ffcc;
            padding: 6px 12px; border-radius: 4px; font-size: 11px; letter-spacing: 1px;
        }
        #gps-badge {
            position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,.65); color: #aaa;
            padding: 3px 12px; border-radius: 12px; font-size: 11px;
            z-index: 1000; display: none; letter-spacing: 1px; white-space: nowrap;
        }

        /* ── CONTROLS ── */
        #ui-layer {
            position: fixed; bottom: 20px; left: 0; right: 0;
            display: none; flex-direction: column; align-items: center;
            pointer-events: none; z-index: 1000; gap: 8px;
        }
        .ctrl-row { display: flex; gap: 10px; pointer-events: auto; }
        .ctrl-btn {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(0,0,0,.7); border: 2px solid #00ffcc; color: #00ffcc;
            font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent;
            transition: background .12s, color .12s;
            font-family: 'Courier New', monospace;
        }
        .ctrl-btn:active { background: #00ffcc; color: #000; }
        .ctrl-btn.reset  { border-color: #ff8800; color: #ff8800; width: 48px; height: 48px; }
        .ctrl-btn.reset:active { background: #ff8800; color: #000; }
        #step-row { display: flex; gap: 8px; pointer-events: auto; }
        .step-btn {
            padding: 5px 13px; border-radius: 12px;
            background: rgba(0,0,0,.7); border: 1px solid #444; color: #888;
            font-size: 12px; cursor: pointer; font-family: 'Courier New', monospace;
            transition: all .15s; -webkit-tap-highlight-color: transparent;
        }
        .step-btn.active { border-color: #00ffcc; color: #00ffcc; }
    </style>
</head>
<body>

<video id="ar-video-source" autoplay playsinline muted></video>

<div id="initial-screen">
    <h2>⬡ AR Boundary v3</h2>
    <ul id="status-list">
        <li><span class="s-icon s-wait" id="cam-icon">◌</span><span id="cam-label">Caméra — en attente…</span></li>
        <li><span class="s-icon s-wait" id="gps-icon">◌</span><span id="gps-label">GPS — en attente…</span></li>
        <li><span class="s-icon s-wait" id="cmp-icon">◌</span><span id="cmp-label">Boussole — en attente…</span></li>
    </ul>
    <div id="acc-wrap"><div id="acc-bar"></div></div>
    <button id="start-btn" onclick="startAR()" disabled>CHARGER LES BORNES</button>
</div>

<div id="top-menu">
    <button class="menu-btn clear-btn" onclick="clearSettings()">RESET</button>
    <div id="coord-display">X:0.0 Z:0.0 R:0.0°</div>
    <button class="menu-btn save-btn" onclick="saveSettings()">SAUVEGARDER</button>
</div>
<div id="gps-badge">GPS ±-- m</div>

<div id="ui-layer">
    <div id="step-row">
        <button class="step-btn active" onclick="setStep(0.5,this)">0.5m</button>
        <button class="step-btn"        onclick="setStep(2.0,this)">2m</button>
        <button class="step-btn"        onclick="setStep(10, this)">10m</button>
    </div>
    <div class="ctrl-row">
        <button class="ctrl-btn" onclick="adjust('rot', stepSize)">↻</button>
        <button class="ctrl-btn" onclick="adjust('z', -stepSize)">▲</button>
        <button class="ctrl-btn" onclick="adjust('rot',-stepSize)">↺</button>
    </div>
    <div class="ctrl-row">
        <button class="ctrl-btn" onclick="adjust('x',-stepSize)">◀</button>
        <button class="ctrl-btn reset"  onclick="resetLive()">●</button>
        <button class="ctrl-btn" onclick="adjust('x', stepSize)">▶</button>
    </div>
    <div class="ctrl-row">
        <button class="ctrl-btn" onclick="adjust('z', stepSize)">▼</button>
    </div>
</div>

<a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;">

    <a-light type="ambient" intensity="1.5"></a-light>

    <a-camera
        id="main-camera"
        gps-new-camera="gpsMinDistance: 2; gpsTimeInterval: 1000"
        look-controls="enabled: true; magicWindowTrackingEnabled: true"
        rotation-reader
        far="10000"
        near="0.01">
    </a-camera>

    <!--
        UNE SEULE ancre GPS = le point 0 du terrain.
        Tout le reste est en coordonnées locales X/Z calculées
        par rapport à cette ancre, en mètres.
    -->
    <a-entity id="gps-anchor"
        gps-new-entity-place="latitude: 45.36275270109053; longitude: -71.06799299683564">

        <!-- Le "rig" de calibration : on bouge juste ce container -->
        <a-entity id="calib-rig">
            <!-- Les murs et marqueurs seront injectés ici -->
        </a-entity>

    </a-entity>

</a-scene>

<script>
// ─────────────────────────────────────────────
//  TERRAIN — point 0 = ancre GPS
// ─────────────────────────────────────────────
const ANCHOR = { lat: 45.36275270109053, lon: -71.06799299683564 };

const boundaryPoints = [
    {lat: 45.36275270109053, lon: -71.06799299683564},
    {lat: 45.36293636564523, lon: -71.06796516797210},
    {lat: 45.36464470163011, lon: -71.06799923635670},
    {lat: 45.36464382495869, lon: -71.06574886446494},
    {lat: 45.36409500535321, lon: -71.06574970802724},
    {lat: 45.36409469181381, lon: -71.06497117171959},
    {lat: 45.36354587220936, lon: -71.06497202328269},
    {lat: 45.36354618574768, lon: -71.06575055158952},
    {lat: 45.36275185642023, lon: -71.06575805095848},
    {lat: 45.36275270109053, lon: -71.06799299683564}  // fermeture
];

// ─────────────────────────────────────────────
//  CONVERSION GPS → X/Z local (mètres)
//  Par rapport à ANCHOR, dans le repère A-Frame :
//    X = Est/Ouest   (Est = +X)
//    Z = Nord/Sud    (Nord = -Z  dans A-Frame)
// ─────────────────────────────────────────────
function toLocal(point) {
    const dist    = geolib.getDistance(
        { latitude: ANCHOR.lat, longitude: ANCHOR.lon },
        { latitude: point.lat,  longitude: point.lon  }
    );
    const bearing = geolib.getRhumbLineBearing(
        { latitude: ANCHOR.lat, longitude: ANCHOR.lon },
        { latitude: point.lat,  longitude: point.lon  }
    );
    // bearing 0° = Nord, 90° = Est
    // A-Frame : Nord = -Z, Est = +X
    const rad = bearing * Math.PI / 180;
    return {
        x:  dist * Math.sin(rad),   // Est  = +X
        z: -dist * Math.cos(rad)    // Nord = -Z
    };
}

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let offsetState  = { x: 0, z: 0, rot: 0 };
let stepSize     = 0.5;
let cameraReady  = false;
let gpsReady     = false;
let compassReady = false;
let arStarted    = false;
let calibRig     = null;

// ─────────────────────────────────────────────
//  PERSISTENCE
// ─────────────────────────────────────────────
function loadSettings() {
    try {
        const s = localStorage.getItem('arBoundaryCalib_v3');
        if (s) offsetState = JSON.parse(s);
    } catch(e) {}
}
function saveSettings() {
    localStorage.setItem('arBoundaryCalib_v3', JSON.stringify(offsetState));
    const d = document.getElementById('coord-display');
    d.style.color = '#00ff88'; d.innerText = '✓ SAUVEGARDÉ';
    setTimeout(() => { d.style.color = '#00ffcc'; updateDisplay(); }, 1800);
}
function clearSettings() {
    if (!confirm('Réinitialiser la calibration?')) return;
    localStorage.removeItem('arBoundaryCalib_v3');
    offsetState = { x: 0, z: 0, rot: 0 };
    applyCalib();
}

// ─────────────────────────────────────────────
//  BUILD — tout en coordonnées locales X/Z
// ─────────────────────────────────────────────
function buildBoundary() {
    calibRig = document.getElementById('calib-rig');

    // ── Murs ──
    for (let i = 0; i < boundaryPoints.length - 1; i++) {
        const p1 = boundaryPoints[i];
        const p2 = boundaryPoints[i + 1];

        const lp1 = toLocal(p1);
        const lp2 = toLocal(p2);

        // Centre du segment en X/Z
        const midX = (lp1.x + lp2.x) / 2;
        const midZ = (lp1.z + lp2.z) / 2;

        // Longueur du segment
        const dx  = lp2.x - lp1.x;
        const dz  = lp2.z - lp1.z;
        const len = Math.sqrt(dx * dx + dz * dz);

        // Angle dans l'espace A-Frame (atan2 donne l'angle par rapport à +Z)
        const angleY = Math.atan2(dx, dz) * (180 / Math.PI);

        // Mur jaune
        const wall = document.createElement('a-box');
        wall.setAttribute('position', `${midX} 2 ${midZ}`);
        wall.setAttribute('rotation', `0 ${angleY} 0`);
        wall.setAttribute('width',    '0.4');
        wall.setAttribute('height',   '4');
        wall.setAttribute('depth',    String(len));
        wall.setAttribute('color',    '#ffdd00');
        wall.setAttribute('opacity',  '0.55');
        wall.setAttribute('material', 'side: double');
        calibRig.appendChild(wall);

        // Bande de sol orange
        const base = document.createElement('a-box');
        base.setAttribute('position', `${midX} 0.08 ${midZ}`);
        base.setAttribute('rotation', `0 ${angleY} 0`);
        base.setAttribute('width',    '0.7');
        base.setAttribute('height',   '0.15');
        base.setAttribute('depth',    String(len + 0.3));
        base.setAttribute('color',    '#ff6600');
        base.setAttribute('opacity',  '0.9');
        calibRig.appendChild(base);
    }

    // ── Marqueurs de coins ──
    for (let i = 0; i < boundaryPoints.length; i++) {
        // Ne pas dupliquer le dernier point (identique au premier)
        if (i === boundaryPoints.length - 1) break;

        const lp      = toLocal(boundaryPoints[i]);
        const isFirst = i === 0;

        const cyl = document.createElement('a-cylinder');
        cyl.setAttribute('position', `${lp.x} ${isFirst ? 4 : 1.5} ${lp.z}`);
        cyl.setAttribute('color',    isFirst ? '#ff2222' : '#ff44aa');
        cyl.setAttribute('height',   isFirst ? '8' : '3');
        cyl.setAttribute('radius',   isFirst ? '0.5' : '0.2');
        cyl.setAttribute('opacity',  '0.95');
        calibRig.appendChild(cyl);

        // Numéro de borne
        const lbl = document.createElement('a-text');
        lbl.setAttribute('value',    String(i + 1));
        lbl.setAttribute('color',    '#ffffff');
        lbl.setAttribute('align',    'center');
        lbl.setAttribute('scale',    '6 6 6');
        lbl.setAttribute('position', `${lp.x} ${isFirst ? 9.5 : 5} ${lp.z}`);
        lbl.setAttribute('look-at',  '#main-camera');
        calibRig.appendChild(lbl);
    }

    applyCalib();
}

// ─────────────────────────────────────────────
//  CALIBRATION
// ─────────────────────────────────────────────
function applyCalib() {
    if (!calibRig) return;
    calibRig.setAttribute('position', { x: offsetState.x, y: 0, z: offsetState.z });
    calibRig.setAttribute('rotation', { x: 0, y: offsetState.rot, z: 0 });
    updateDisplay();
}

function adjust(axis, val) {
    if (axis === 'x')   offsetState.x   += val;
    if (axis === 'z')   offsetState.z   += val;
    if (axis === 'rot') offsetState.rot += val;
    applyCalib();
}
function resetLive() {
    offsetState = { x: 0, z: 0, rot: 0 };
    applyCalib();
}
function setStep(val, btn) {
    stepSize = val;
    document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}
function updateDisplay() {
    document.getElementById('coord-display').innerText =
        `X:${offsetState.x.toFixed(1)} Z:${offsetState.z.toFixed(1)} R:${offsetState.rot.toFixed(1)}°`;
}

// ─────────────────────────────────────────────
//  COMPASS
// ─────────────────────────────────────────────
async function requestCompass() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const res = await DeviceOrientationEvent.requestPermission();
            if (res === 'granted') {
                setStatus('cmp', 'ok', '✓ Boussole accordée');
                compassReady = true;
            } else {
                setStatus('cmp', 'err', '✗ Boussole refusée');
            }
        } catch(e) {
            setStatus('cmp', 'err', '✗ Erreur boussole');
        }
    } else {
        setStatus('cmp', 'ok', '✓ Boussole disponible');
        compassReady = true;
    }
    checkAllReady();
}

// ─────────────────────────────────────────────
//  CAMERA
// ─────────────────────────────────────────────
function initCamera() {
    const video = document.getElementById('ar-video-source');
    navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} },
        audio: false
    })
    .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play();
            setStatus('cam', 'ok', '✓ Caméra prête');
            cameraReady = true;
            checkAllReady();
        };
    })
    .catch(err => {
        setStatus('cam', 'err', '✗ Caméra refusée');
        console.error(err);
    });
}

// ─────────────────────────────────────────────
//  GPS
// ─────────────────────────────────────────────
function initGps() {
    if (!navigator.geolocation) {
        setStatus('gps', 'err', '✗ GPS non disponible'); return;
    }
    navigator.geolocation.watchPosition(pos => {
        const acc = Math.round(pos.coords.accuracy);
        document.getElementById('gps-badge').innerText = `GPS ±${acc} m`;
        const pct = Math.max(0, Math.min(100, (1 - acc / 30) * 100));
        const bar = document.getElementById('acc-bar');
        bar.style.width      = pct + '%';
        bar.style.background = acc < 5 ? '#00ffcc' : acc < 20 ? '#ffaa00' : '#ff4444';
        if (!gpsReady) {
            if (acc <= 20) {
                setStatus('gps', 'ok', `✓ GPS prêt (±${acc} m)`);
                gpsReady = true; checkAllReady();
            } else {
                setStatus('gps', 'wait', `GPS en cours… ±${acc} m`);
            }
        }
    }, err => {
        setStatus('gps', 'err', '✗ GPS — activez la localisation');
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function setStatus(key, state, text) {
    const icon  = document.getElementById(`${key}-icon`);
    const label = document.getElementById(`${key}-label`);
    icon.className = `s-icon s-${state}`;
    icon.innerText = state === 'ok' ? '✓' : state === 'err' ? '✗' : '◌';
    label.innerText = text;
}
function checkAllReady() {
    if (cameraReady && gpsReady && compassReady)
        document.getElementById('start-btn').disabled = false;
}

// ─────────────────────────────────────────────
//  START
// ─────────────────────────────────────────────
async function startAR() {
    if (arStarted) return;
    await requestCompass();
    if (!compassReady) return;

    arStarted = true;
    loadSettings();
    buildBoundary();

    document.getElementById('initial-screen').style.display = 'none';
    document.getElementById('top-menu').style.display = 'flex';
    document.getElementById('ui-layer').style.display  = 'flex';
    document.getElementById('gps-badge').style.display = 'block';
    updateDisplay();
}

// ─────────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────────
window.addEventListener('load', () => {
    initCamera();
    initGps();
    // Android : pas besoin de permission boussole
    if (typeof DeviceOrientationEvent === 'undefined' ||
        typeof DeviceOrientationEvent.requestPermission !== 'function') {
        setStatus('cmp', 'ok', '✓ Boussole disponible');
        compassReady = true;
        checkAllReady();
    }
});
</script>
</body>
</html>
