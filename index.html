<!DOCTYPE html>
<html>
<head>
    <title>Precision AR Boundaries</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #overlay {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.8); color: white;
            padding: 15px; border-radius: 8px; z-index: 1000;
            text-align: center;
        }
        #status-bar {
            height: 4px; background: #444; width: 100%; margin-top: 10px;
        }
        #status-progress {
            height: 100%; background: #0f0; width: 0%; transition: width 0.2s;
        }
        button {
            margin-top: 10px; padding: 10px 20px;
            background: #0f0; border: none; font-weight: bold; cursor: pointer;
            display: none;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <div id="msg">Initializing GPS...</div>
        <div id="status-bar"><div id="status-progress"></div></div>
        <button id="start-btn" onclick="startAR()">SHOW BOUNDARIES</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        // How many GPS samples to average before locking position
        const SAMPLE_COUNT = 20; 
        
        const boundaryPoints = [
          {lat: 45.36275270109053, lon: -71.06799299683564},
          {lat: 45.36293636564523, lon: -71.0679651679721},
          {lat: 45.36464470163011, lon: -71.0679992363567},
          {lat: 45.36464382495869, lon: -71.06574886446494},
          {lat: 45.364095005353214, lon: -71.06574970802724},
          {lat: 45.36409469181381, lon: -71.06497117171959},
          {lat: 45.36354587220936, lon: -71.06497202328269},
          {lat: 45.36354618574768, lon: -71.06575055158952},
          {lat: 45.36275185642023, lon: -71.06575805095848},
          {lat: 45.36275270109053, lon: -71.06799299683564} 
        ];

        // --- GPS AVERAGING LOGIC ---
        let samples = [];
        let watchId = null;

        function initGPS() {
            if (!navigator.geolocation) {
                document.getElementById('msg').innerText = "Geolocation not supported.";
                return;
            }
            
            document.getElementById('msg').innerText = "Calibrating Position (Stand Still)... 0/" + SAMPLE_COUNT;

            const options = {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            };

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    // Collect sample
                    samples.push({
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude
                    });

                    // Update UI
                    const progress = (samples.length / SAMPLE_COUNT) * 100;
                    document.getElementById('status-progress').style.width = progress + "%";
                    document.getElementById('msg').innerText = `Calibrating: ${samples.length}/${SAMPLE_COUNT}\nAccuracy: ±${Math.round(pos.coords.accuracy)}m`;

                    if (samples.length >= SAMPLE_COUNT) {
                        finishCalibration();
                    }
                }, 
                (err) => console.error(err), 
                options
            );
        }

        function finishCalibration() {
            navigator.geolocation.clearWatch(watchId);
            
            // Calculate average
            let avgLat = 0, avgLon = 0;
            samples.forEach(s => { avgLat += s.lat; avgLon += s.lon; });
            avgLat /= samples.length;
            avgLon /= samples.length;

            // Store user's start position for relative offset (optional if using absolute)
            // But mainly, we are now ready to render
            document.getElementById('msg').innerHTML = "Position Locked!<br>Avg Accuracy Reached.";
            document.getElementById('start-btn').style.display = "inline-block";
            
            // Note: AR.js handles the camera updating, but we waited to ensure 
            // the GPS hardware is "warmed up" and stable before the user starts looking.
        }

        function startAR() {
            document.getElementById('overlay').style.display = 'none';
            // Trigger the A-Frame component generation
            const scene = document.querySelector('a-scene');
            const generator = document.createElement('a-entity');
            generator.setAttribute('boundary-lines', '');
            scene.appendChild(generator);
        }

        // --- MATH HELPERS ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getMidpoint(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180, lat2Rad = lat2 * Math.PI / 180, lon1Rad = lon1 * Math.PI / 180;
            const Bx = Math.cos(lat2Rad) * Math.cos(dLon);
            const By = Math.cos(lat2Rad) * Math.sin(dLon);
            const lat3 = Math.atan2(Math.sin(lat1Rad) + Math.sin(lat2Rad), Math.sqrt((Math.cos(lat1Rad) + Bx)**2 + By**2));
            const lon3 = lon1Rad + Math.atan2(By, Math.cos(lat1Rad) + Bx);
            return { lat: lat3 * 180 / Math.PI, lon: lon3 * 180 / Math.PI };
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const y = Math.sin(lon2 - lon1) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        // --- AR RENDERER ---
        AFRAME.registerComponent('boundary-lines', {
            init: function () {
                const scene = document.querySelector('a-scene');
                for (let i = 0; i < boundaryPoints.length - 1; i++) {
                    const p1 = boundaryPoints[i];
                    const p2 = boundaryPoints[i+1];
                    const mid = getMidpoint(p1.lat, p1.lon, p2.lat, p2.lon);
                    const dist = getDistance(p1.lat, p1.lon, p2.lat, p2.lon);
                    const angle = getBearing(p1.lat * Math.PI/180, p1.lon * Math.PI/180, p2.lat * Math.PI/180, p2.lon * Math.PI/180);

                    const entity = document.createElement('a-entity');
                    entity.setAttribute('gps-new-entity-place', { latitude: mid.lat, longitude: mid.lon });

                    const tube = document.createElement('a-cylinder');
                    tube.setAttribute('height', dist);
                    tube.setAttribute('radius', 0.05); // Thinner, more precise looking
                    tube.setAttribute('color', '#00ffcc'); // Neon cyan for visibility
                    tube.setAttribute('opacity', '0.9');
                    tube.setAttribute('position', '0 0 0'); 
                    tube.setAttribute('rotation', `90 ${0 - angle} 0`);
                    
                    entity.appendChild(tube);
                    scene.appendChild(entity);
                }
            }
        });

        window.onload = initGPS;
    </script>

    <a-scene vr-mode-ui="enabled: false" arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;" renderer="antialias: true; alpha: true">
        <a-camera gps-new-camera='gpsMinDistance: 5'></a-camera>
    </a-scene>
</body>
</html>
