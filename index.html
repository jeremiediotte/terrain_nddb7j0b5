<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AR Land Boundary — Walkable Line (Style C)</title>

<!-- A-Frame 1.2.0 -->
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

<!-- AR.js 3.3.2 -->
<script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

<!-- Turf.js -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>

<style>
  body { margin:0; background:#000; overflow:hidden; }
  #calibrate-btn {
    position: absolute; left: 10px; top: 10px; z-index: 9999;
    padding: 8px 12px; background: #fff; border-radius: 6px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  #compass {
    position: absolute; right: 10px; top: 10px; z-index: 9999;
    padding: 6px 10px; background: rgba(0,0,0,0.36); color: #fff;
    border-radius: 6px; font-family: sans-serif;
  }
  #status {
    position: absolute; left: 10px; bottom: 10px; z-index:9999;
    padding:6px 10px; background: rgba(0,0,0,0.36); color: #fff;
    border-radius:6px; font-family: sans-serif; font-size:13px;
  }
</style>
</head>
<body>

<button id="calibrate-btn">Calibrate Here</button>
<div id="compass">North: --°</div>
<div id="status">Waiting for GPS & Camera...</div>

<a-scene embedded arjs="sourceType: webcam; gpsMinAccuracy: 20;" vr-mode-ui="enabled: false">
  <a-entity id="land-boundary"></a-entity>
  <a-entity id="land-polygon"></a-entity>
  <a-entity id="boundary"></a-entity>
  <a-entity id="user-marker"></a-entity>
  <a-camera id="camera" gps-camera rotation-reader></a-camera>
</a-scene>

<script>
// ---------- USER COORDINATES ----------
const corners = [
  [45.3627519,-71.0657581],  
[45.3635462,-71.0657506],  
[45.3635459,-71.064972],  
[45.3640947,-71.0649712],  
[45.364095,-71.0657497],  
[45.3646438,-71.0657489], 
[45.3646447,-71.0679992],  
[45.3629364,-71.0679652],  
[45.3627527,-71.067993]
];

// ---------- Scene elements ----------
const landEl = document.getElementById('land-boundary');
const polygonEl = document.getElementById('land-polygon');
const boundaryEl = document.getElementById('boundary');
const userEl = document.getElementById('user-marker');
const cameraEl = document.getElementById('camera');
const compassEl = document.getElementById('compass');
const statusEl = document.getElementById('status');
const calibrateBtn = document.getElementById('calibrate-btn');

// ---------- Smoothing ----------
let alpha = 0.2;
let smoothLat = null;
let smoothLon = null;

// ---------- Helper: lat/lon -> local meters ----------
const origin = { lat: corners[0][0], lon: corners[0][1] };
function latLonToMeters(lat, lon) {
  const R = 6378137;
  const dLat = THREE.MathUtils.degToRad(lat - origin.lat);
  const dLon = THREE.MathUtils.degToRad(lon - origin.lon);
  const x = dLon * R * Math.cos(THREE.MathUtils.degToRad(origin.lat));
  const z = dLat * R;
  return { x, y:0, z };
}

// ---------- Draw corner poles ----------
const localPositions = corners.map(c => latLonToMeters(c[0], c[1]));

localPositions.forEach((pos,i)=>{
  const pole = document.createElement('a-cylinder');
  pole.setAttribute('position',`${pos.x} 0 ${pos.z}`);
  pole.setAttribute('height','2.0');
  pole.setAttribute('radius','0.09');
  pole.setAttribute('color','#1a9a3a'); // green
  landEl.appendChild(pole);

  const cap = document.createElement('a-sphere');
  cap.setAttribute('position',`${pos.x} 1.05 ${pos.z}`);
  cap.setAttribute('radius','0.16');
  cap.setAttribute('color','#00cc66');
  landEl.appendChild(cap);

  const label = document.createElement('a-text');
  label.setAttribute('value',`H: 2.0 m`);
  label.setAttribute('position',`${pos.x} 2.2 ${pos.z}`);
  label.setAttribute('align','center');
  label.setAttribute('color','#fff');
  label.setAttribute('side','double');
  landEl.appendChild(label);
});

// ---------- Draw ground polygon ----------
(function buildPolygon(){
  const A3 = AFRAME.THREE;
  if(localPositions.length<3) return;
  const pts = localPositions.map(p=>new A3.Vector2(p.x,p.z));
  const shape = new A3.Shape(pts);
  const geom = new A3.ShapeGeometry(shape);
  const mat = new A3.MeshBasicMaterial({color:0x00cc66,opacity:0.28,transparent:true,side:A3.DoubleSide,depthWrite:false});
  const mesh = new A3.Mesh(geom,mat);
  mesh.position.set(0,0.01,0);
  polygonEl.setObject3D('mesh',mesh);
})();

// ---------- Draw boundary walkable line ----------
(function drawBoundary(){
  const pts = [...localPositions, localPositions[0]]; // close loop
  for(let i=0;i<pts.length-1;i++){
    const seg = document.createElement('a-entity');
    seg.setAttribute('line',`start:${pts[i].x} 0 ${pts[i].z}; end:${pts[i+1].x} 0 ${pts[i+1].z}; width:3`);
    seg.setAttribute('material',{color:'#00ff00'});
    boundaryEl.appendChild(seg);
  }
})();

// ---------- User "You are here" marker ----------
const userSphere = document.createElement('a-sphere');
userSphere.setAttribute('radius','0.22');
userSphere.setAttribute('color','#ff3333');
userSphere.setAttribute('opacity','0.95');
userSphere.setAttribute('position','0 0.12 0');
userEl.appendChild(userSphere);

// ---------- Compass ----------
function handleOrientation(e){
  let alpha = e.alpha;
  if(alpha===null || alpha===undefined) return;
  compassEl.innerText=`North: ${Math.round(alpha)}°`;
}
window.addEventListener('deviceorientationabsolute', handleOrientation,true);
window.addEventListener('deviceorientation', handleOrientation,true);

// ---------- Calibration button ----------
calibrateBtn.addEventListener('click',()=>{
  if(!navigator.geolocation){ alert('Geolocation not available.'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    origin.lat = pos.coords.latitude;
    origin.lon = pos.coords.longitude;
    alert('Calibration saved at current position.');
  },err=>{ alert('Could not read location: '+err.message); }, {enableHighAccuracy:true,maximumAge:5000});
});

// ---------- GPS watch + smoothing ----------
if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    let lat = pos.coords.latitude;
    let lon = pos.coords.longitude;

    if(smoothLat===null){ smoothLat=lat; smoothLon=lon; }
    smoothLat = alpha*lat + (1-alpha)*smoothLat;
    smoothLon = alpha*lon + (1-alpha)*smoothLon;

    const p = latLonToMeters(smoothLat,smoothLon);
    userSphere.setAttribute('position',`${p.x} 0.12 ${p.z}`);

    statusEl.innerText=`GPS accuracy: ${Math.round(pos.coords.accuracy)} m`;
  },err=>{ statusEl.innerText='GPS error: '+err.message; },
  {enableHighAccuracy:true, maximumAge:1000, timeout:5000});
} else {
  statusEl.innerText='Geolocation unsupported.';
}

setTimeout(()=>{statusEl.innerText='Point camera, allow Camera & Location, then walk your land.';},1200);
</script>

</body>
</html>
