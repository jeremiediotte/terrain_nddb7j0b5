<!DOCTYPE html>
<html>
<head>
    <title>AR Land Boundaries</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #debug {
            position: absolute; 
            top: 10px; left: 10px; 
            background: rgba(0,0,0,0.7); 
            color: #0f0; 
            padding: 10px; 
            font-family: monospace; 
            z-index: 1000;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div id="debug">Loading GPS...</div>

    <script>
        // YOUR DATA
        const boundaryPoints = [
          {lat: 45.36275270109053, lon: -71.06799299683564},
          {lat: 45.36293636564523, lon: -71.0679651679721},
          {lat: 45.36464470163011, lon: -71.0679992363567},
          {lat: 45.36464382495869, lon: -71.06574886446494},
          {lat: 45.364095005353214, lon: -71.06574970802724},
          {lat: 45.36409469181381, lon: -71.06497117171959},
          {lat: 45.36354587220936, lon: -71.06497202328269},
          {lat: 45.36354618574768, lon: -71.06575055158952},
          {lat: 45.36275185642023, lon: -71.06575805095848},
          // Close the loop back to start
          {lat: 45.36275270109053, lon: -71.06799299683564} 
        ];

        // Helper: Calculate distance between two coordinates (Haversine)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        // Helper: Calculate midpoint between two coordinates
        function getMidpoint(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const lon1Rad = lon1 * Math.PI / 180;

            const Bx = Math.cos(lat2Rad) * Math.cos(dLon);
            const By = Math.cos(lat2Rad) * Math.sin(dLon);
            const lat3 = Math.atan2(Math.sin(lat1Rad) + Math.sin(lat2Rad), Math.sqrt((Math.cos(lat1Rad) + Bx) * (Math.cos(lat1Rad) + Bx) + By * By));
            const lon3 = lon1Rad + Math.atan2(By, Math.cos(lat1Rad) + Bx);

            return {
                lat: lat3 * 180 / Math.PI,
                lon: lon3 * 180 / Math.PI
            };
        }

        // Helper: Calculate bearing (angle) between two coordinates
        function getBearing(lat1, lon1, lat2, lon2) {
            const y = Math.sin(lon2 - lon1) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) -
                      Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
            const brng = Math.atan2(y, x);
            return (brng * 180 / Math.PI + 360) % 360; // Degrees
        }

        AFRAME.registerComponent('boundary-lines', {
            init: function () {
                const debug = document.getElementById('debug');
                const scene = document.querySelector('a-scene');

                debug.innerHTML = "Generating " + (boundaryPoints.length - 1) + " segments...";

                for (let i = 0; i < boundaryPoints.length - 1; i++) {
                    const p1 = boundaryPoints[i];
                    const p2 = boundaryPoints[i+1];

                    // 1. Get Midpoint (we place the object here)
                    const mid = getMidpoint(p1.lat, p1.lon, p2.lat, p2.lon);
                    
                    // 2. Get Distance (length of the tube)
                    const dist = getDistance(p1.lat, p1.lon, p2.lat, p2.lon);

                    // 3. Get Bearing (rotation of the tube)
                    const angle = getBearing(p1.lat * Math.PI/180, p1.lon * Math.PI/180, 
                                           p2.lat * Math.PI/180, p2.lon * Math.PI/180);

                    // Create the anchor entity at the midpoint GPS location
                    const entity = document.createElement('a-entity');
                    entity.setAttribute('gps-new-entity-place', {
                        latitude: mid.lat,
                        longitude: mid.lon
                    });

                    // Create the tube (Cylinder)
                    // We rotate 90deg on X to lay it flat, and Y to match compass heading
                    const tube = document.createElement('a-cylinder');
                    tube.setAttribute('height', dist);
                    tube.setAttribute('radius', 0.1); // Thickness of tube
                    tube.setAttribute('color', 'red');
                    tube.setAttribute('opacity', '0.8');
                    // Position: 0 X, 0.3 Y (1 foot up), 0 Z
                    tube.setAttribute('position', '0 0.3 0'); 
                    // Rotation: Lay flat (90), Rotate to bearing (0 - angle)
                    // Note: A-Frame rotation is YXZ. 
                    tube.setAttribute('rotation', `90 ${0 - angle} 0`);

                    entity.appendChild(tube);
                    scene.appendChild(entity);
                }

                debug.innerHTML = "Boundaries loaded. Look around.";
            }
        });
    </script>

    <a-scene
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        renderer="antialias: true; alpha: true">
        
        <a-camera gps-new-camera='gpsMinDistance: 5' rotation-reader></a-camera>
        
        <a-entity boundary-lines></a-entity>
        
    </a-scene>
</body>
</html>
